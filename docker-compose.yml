services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TAPS_DATA_DIR: /data
      # Shown in the touch console as the way to add beers, e.g. pi@kegerator.local (see .env.example).
      TAPS_SSH_TARGET: ${TAPS_SSH_TARGET:-}
      # Simulated sensors + fake pours for trying it out on a Mac: TAPS_MOCK=1 TAPS_DEMO_POURS=1 docker compose up --build
      TAPS_MOCK: ${TAPS_MOCK:-0}
      TAPS_DEMO_POURS: ${TAPS_DEMO_POURS:-0}
    volumes:
      # SQLite database and config.toml live here on the host.
      - ./data:/data
      # Use the Pi's time zone for dates in the `taps` CLI.
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Direct API access from this computer only (the app also reaches it through the frontend at /api).
      - "127.0.0.1:${API_PORT:-8001}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The touch display opens http://localhost:8080; other devices use http://<pi>:8080
      - "${APP_PORT:-8080}:80"
